<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Machine Party</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #000000;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="Machine Party.icon.png" />
<link rel="apple-touch-icon" href="Machine Party.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--false use-filter--false" src="Machine Party.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="Machine Party.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"Machine Party","experimentalVK":false,"fileSizes":{"Machine Party.pck":606081096,"Machine Party.wasm":1656762},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = true;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	// Split-.pck boot: downloads <exe>.pck.partNN + manifest, reassembles
	// in memory, and boots the engine from the buffer. Falls back to the
	// stock whole-pack boot when no manifest is published.
	function setBar(current, total) {
		if (current > 0 && total > 0) {
			statusProgress.value = current;
			statusProgress.max = total;
		} else {
			statusProgress.removeAttribute('value');
			statusProgress.removeAttribute('max');
		}
	}

	async function bootChunkedPack() {
		const exe = GODOT_CONFIG['executable'];
		const packName = exe + '.pck';
		let manifest = null;
		try {
			const manifestResp = await fetch(packName + '.parts.json');
			if (manifestResp.ok) {
				manifest = await manifestResp.json();
			}
		} catch (err) {
			manifest = null;
		}
		if (!manifest || !manifest['parts'] || manifest['parts'].length === 0) {
			return engine.startGame({
				'onProgress': function (current, total) {
					setBar(current, total);
				},
			});
		}
		const parts = manifest['parts'];
		const totalPack = manifest['totalSize'];
		const wasmSize = (GODOT_CONFIG['fileSizes'] && GODOT_CONFIG['fileSizes'][exe + '.wasm']) || 0;
		const grandTotal = totalPack + wasmSize;
		console.log('[pck-split] downloading ' + parts.length + ' parts (' + totalPack + ' bytes)');
		const combined = new Uint8Array(totalPack);
		let offset = 0;
		let done = 0;
		for (const part of parts) {
			const resp = await fetch(part['file']);
			if (!resp.ok || !resp.body) {
				throw new Error('Failed to download ' + part['file']);
			}
			const reader = resp.body.getReader();
			let received = 0;
			for (;;) {
				const chunk = await reader.read();
				if (chunk.done) {
					break;
				}
				combined.set(chunk.value, offset);
				offset += chunk.value.length;
				received += chunk.value.length;
				setBar(done + received, grandTotal);
			}
			if (received !== part['size']) {
				throw new Error('Truncated download: ' + part['file']);
			}
			done += received;
		}
		if (offset !== totalPack) {
			throw new Error('Assembled pack size mismatch.');
		}
		console.log('[pck-split] pack assembled, booting engine');
		statusProgress.removeAttribute('value');
		statusProgress.removeAttribute('max');
		await engine.init(exe);
		await engine.preloadFile(combined.buffer, packName);
		const args = (GODOT_CONFIG['args'] || []).slice();
		await engine.start({
			'args': ['--main-pack', packName].concat(args),
			'onProgress': function (current, total) {
				setBar(done + current, grandTotal);
			},
		});
	}
	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		bootChunkedPack().then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
